<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">WinSentinel - Windows security auditor and hardening console</title>
  <desc id="desc">A graphite banner with a muted gray shield, the WinSentinel wordmark, and the workflow audit, harden, verify.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111317"/>
      <stop offset="0.55" stop-color="#171a1e"/>
      <stop offset="1" stop-color="#111317"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#96a9bd" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#96a9bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3138"/>
      <stop offset="1" stop-color="#191c21"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#96a9bd" stroke-opacity="0.04"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#background)"/>
  <rect width="1280" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="170" cy="160" r="230" fill="url(#glow)"/>

  <path d="M0 1H1280" stroke="#96a9bd" stroke-opacity="0.28"/>
  <path d="M0 319H1280" stroke="#96a9bd" stroke-opacity="0.10"/>

  <g fill="none" stroke="#96a9bd">
    <circle cx="170" cy="160" r="132" stroke-opacity="0.09"/>
    <circle cx="170" cy="160" r="150" stroke-opacity="0.05" stroke-dasharray="2 9"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M170 68
             L240 96
             V158
             C240 202 208 235 170 252
             C132 235 100 202 100 158
             V96
             Z"
          fill="url(#shieldFill)"
          stroke="#96a9bd"
          stroke-width="7"
          stroke-linejoin="round"/>
    <path d="M170 92
             L218 112
             V157
             C218 187 196 210 170 224
             C144 210 122 187 122 157
             V112
             Z"
          fill="#191c21"
          stroke="#96a9bd"
          stroke-opacity="0.20"
          stroke-width="2"/>
    <path d="M139 160 L161 182 L202 138"
          fill="none"
          stroke="#f1f4f7"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="300" y="140" font-size="64" font-weight="700" fill="#f1f4f7" letter-spacing="-1.5">Win<tspan fill="#96a9bd">Sentinel</tspan></text>
    <text x="303" y="184" font-size="22" fill="#abb3bd">Windows security auditor &amp; one-click hardening</text>

    <g font-size="12" font-weight="600" letter-spacing="1.8">
      <rect x="303" y="211" width="112" height="30" rx="15" fill="#27313a" stroke="#96a9bd" stroke-opacity="0.35"/>
      <text x="359" y="230" text-anchor="middle" fill="#96a9bd">LOCAL-FIRST</text>

      <rect x="427" y="211" width="132" height="30" rx="15" fill="#27313a" stroke="#96a9bd" stroke-opacity="0.35"/>
      <text x="493" y="230" text-anchor="middle" fill="#96a9bd">ADMIN-GATED</text>

      <rect x="571" y="211" width="140" height="30" rx="15" fill="#27313a" stroke="#96a9bd" stroke-opacity="0.35"/>
      <text x="641" y="230" text-anchor="middle" fill="#96a9bd">NO TELEMETRY</text>
    </g>
  </g>

  <line x1="920" y1="70" x2="920" y2="250" stroke="#292e34" stroke-width="2"/>

  <g transform="translate(960 96)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <g>
      <circle cx="16" cy="16" r="16" fill="#27313a" stroke="#96a9bd" stroke-opacity="0.65"/>
      <text x="16" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#96a9bd">01</text>
      <text x="46" y="14" font-size="15" font-weight="700" fill="#f1f4f7" letter-spacing="1.4">AUDIT</text>
      <text x="46" y="34" font-size="12" fill="#77808b">Read-only checks</text>
    </g>
    <g transform="translate(0 68)">
      <circle cx="16" cy="16" r="16" fill="#27313a" stroke="#96a9bd" stroke-opacity="0.65"/>
      <text x="16" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#96a9bd">02</text>
      <text x="46" y="14" font-size="15" font-weight="700" fill="#f1f4f7" letter-spacing="1.4">HARDEN</text>
      <text x="46" y="34" font-size="12" fill="#77808b">Explicit, ordered fixes</text>
    </g>
    <g transform="translate(0 136)">
      <circle cx="16" cy="16" r="16" fill="#27313a" stroke="#96a9bd" stroke-opacity="0.65"/>
      <text x="16" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#96a9bd">03</text>
      <text x="46" y="14" font-size="15" font-weight="700" fill="#f1f4f7" letter-spacing="1.4">VERIFY</text>
      <text x="46" y="34" font-size="12" fill="#77808b">Re-scan after changes</text>
    </g>
  </g>
</svg>
